name: Application flow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check application flow files
        run: |
          test -f application-flow/server.py
          test -f application-flow/hirer-job-designer.html
          test -f application-flow/candidate-application.html

      - name: Check Python syntax
        run: python -m py_compile application-flow/server.py
